    <circle class="dot" style="animation-delay:0.0s" cx="17" cy="17" r="5" fill="#4cc6e0"/>
    <text x="30" y="22" textLength="86" lengthAdjust="spacingAndGlyphs" font-size="14" font-weight="600" fill="#4cc6e0">Pre-Security</text>
  </g></g>
  <g transform="translate(208 222)"><g class="chip" style="animation-delay:0.15s">
    <rect width="194" height="34" rx="17" fill="#a596ff" fill-opacity=".13" stroke="#a596ff" stroke-opacity=".55"/>
    <circle class="dot" style="animation-delay:0.6s" cx="17" cy="17" r="5" fill="#a596ff"/>
    <text x="30" y="22" textLength="148" lengthAdjust="spacingAndGlyphs" font-size="14" font-weight="600" fill="#a596ff">Intro to Cybersecurity</text>
  </g></g>
  <g transform="translate(414 222)"><g class="chip" style="animation-delay:0.30s">
    <rect width="215" height="34" rx="17" fill="#4fd29c" fill-opacity=".13" stroke="#4fd29c" stroke-opacity=".55"/>
    <circle class="dot" style="animation-delay:1.2s" cx="17" cy="17" r="5" fill="#4fd29c"/>
    <text x="30" y="22" textLength="169" lengthAdjust="spacingAndGlyphs" font-size="14" font-weight="600" fill="#4fd29c">Cybersecurity Essentials</text>
  </g></g>
  <g transform="translate(641 222)"><g class="chip" style="animation-delay:0.45s">
    <rect width="144" height="34" rx="17" fill="#ffa45c" fill-opacity=".13" stroke="#ffa45c" stroke-opacity=".55"/>
    <circle class="dot" style="animation-delay:1.8s" cx="17" cy="17" r="5" fill="#ffa45c"/>
    <text x="30" y="22" textLength="98" lengthAdjust="spacingAndGlyphs" font-size="14" font-weight="600" fill="#ffa45c">SANS SEC450</text>
